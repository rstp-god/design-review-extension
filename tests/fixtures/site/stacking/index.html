<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:"
    />
    <title>Stacking — fixture</title>
    <link rel="stylesheet" href="/site.css" />
  </head>
  <body>
    <header class="header">
      <a href="/">Fixture</a>
      <a href="/catalog/">Catalog</a>
      <div class="menu">
        <a href="/catalog/" data-fixture="menu-trigger">Hover menu</a>
        <div class="menu__dropdown" data-fixture="menu-dropdown">
          <a href="/catalog/" data-fixture="menu-item-catalog">Catalog</a>
          <a href="/cart/">Cart</a>
          <a href="/spa/">SPA</a>
        </div>
      </div>
    </header>

    <main>
      <h1 data-fixture="title">Stacking traps</h1>

      <section class="traps">
        <div class="trap trap-high" data-fixture="trap-high">z-index 5, earlier in the DOM</div>
        <div class="trap trap-later" data-fixture="trap-later">Later static block</div>

        <div class="trap-transform" data-fixture="trap-transform">
          <div class="trap-inner" data-fixture="trap-inner">z-index 9999 inside a transform</div>
        </div>
        <div class="trap trap-sibling" data-fixture="trap-sibling">z-index 1 sibling</div>

        <div class="trap-root" data-fixture="trap-root">
          <div class="trap-negative" data-fixture="trap-negative"></div>
          <p class="trap-content" data-fixture="trap-content">Content above a negative z-index</p>
        </div>

        <div class="trap-scroller" data-fixture="trap-scroller">
          <p class="trap-inside" data-fixture="trap-inside">Inside the clip</p>
          <p class="trap-outside" data-fixture="trap-outside">Clipped away</p>
        </div>

        <div class="trap-ghost" data-fixture="trap-ghost">
          <span class="trap-ghost-child" data-fixture="trap-ghost-child">Visible child</span>
        </div>

        <div class="trap-veiled" data-fixture="trap-veiled">
          <button type="button" class="trap-under" data-fixture="trap-under">Under the veil</button>
          <div class="trap-veil" data-fixture="trap-veil"></div>
        </div>
      </section>

      <p class="traps__counter">
        <button type="button" data-fixture="counter">Clicked 0</button>
      </p>
      <div class="spacer"></div>
      <p>Bottom of the page.</p>
    </main>

    <script src="/site.js"></script>
  </body>
</html>
