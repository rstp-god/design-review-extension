name: Build

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node and Yarn
        uses: ./.github/actions/setup

      - name: Lint and format check
        run: yarn check

      - name: Build
        run: yarn build
