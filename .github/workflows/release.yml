name: Release

# Publishes a GitHub Release with the Chrome Web Store zip attached.
#
# Flow: bump `version` in package.json through a PR → merge → push a tag
# `v<version>` on main (e.g. `git tag v0.2.0 && git push origin v0.2.0`).
# The tag must match package.json exactly — the manifest version comes from
# there, and a mismatch would ship a zip whose version disagrees with its
# release.
#
# Release notes are generated by GitHub from the PR titles merged since the
# previous tag; edit them on the release page afterwards if needed.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node and Yarn
        uses: ./.github/actions/setup

      - name: Check tag matches package.json version
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          if [ "$PKG_VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - name: Lint and format check
        run: yarn check

      - name: Unit tests
        run: yarn test

      - name: Build
        run: yarn build

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: Design Review ${{ github.ref_name }}
          generate_release_notes: true
          files: release/*.zip
          fail_on_unmatched_files: true
